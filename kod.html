<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wafi Café — Kitchen Order Display</title>
<style>
  :root{
    --bg:#12100e; --card:#1d1a16; --line:#3a352c;
    --gold:#c9982f; --cream:#f6ecd9; --red:#c0392b; --green:#2e8b57; --blue:#2c6fbb;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--cream); font-family:'Segoe UI', Arial, sans-serif; min-height:100vh;}
  header{
    padding:16px 22px; background:#000; display:flex; justify-content:space-between; align-items:center;
    border-bottom:2px solid var(--gold); position:sticky; top:0; z-index:10;
  }
  header h1{font-size:1.2rem; color:var(--gold); letter-spacing:.05em;}
  header .clock{font-size:1rem; color:var(--cream); opacity:.8;}
  header button{background:transparent; border:1px solid var(--line); color:var(--cream); padding:8px 14px; border-radius:4px; cursor:pointer; font-size:.85rem;}
  header button.active{background:var(--gold); color:#1a0f0a; border-color:var(--gold); font-weight:700;}

  /* LOGIN */
  #loginWrap{max-width:340px; margin:100px auto; padding:30px; background:var(--card); border:1px solid var(--line); border-radius:8px;}
  #loginWrap h2{color:var(--gold); margin-bottom:20px; text-align:center;}
  #loginWrap input{width:100%; padding:12px; margin-bottom:12px; border:1px solid var(--line); border-radius:4px; background:#0f0d0b; color:var(--cream); font-size:1rem;}
  #loginWrap button{width:100%; padding:13px; background:var(--gold); color:#1a0f0a; border:none; border-radius:4px; font-weight:700; font-size:1rem; cursor:pointer;}
  #loginErr{color:var(--red); font-size:.85rem; margin-top:8px; text-align:center; min-height:18px;}

  #board{display:none; padding:20px; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:16px;}
  .empty{grid-column:1/-1; text-align:center; opacity:.5; padding:60px 0; font-size:1.1rem;}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px;
    display:flex; flex-direction:column; gap:10px; border-top:5px solid var(--gold);
  }
  .card.preparing{border-top-color:var(--blue);}
  .card-head{display:flex; justify-content:space-between; align-items:flex-start;}
  .card-head .tbl{font-size:1.3rem; font-weight:700;}
  .card-head .time{font-size:.8rem; opacity:.7;}
  .card .type{display:inline-block; font-size:.7rem; padding:3px 9px; border-radius:12px; background:var(--line); text-transform:uppercase; letter-spacing:.05em; width:fit-content;}
  .lines{border-top:1px dashed var(--line); border-bottom:1px dashed var(--line); padding:10px 0;}
  .line{display:flex; justify-content:space-between; font-size:.95rem; padding:3px 0;}
  .line .qn{font-weight:700; margin-right:8px;}
  .line .ar{direction:rtl; opacity:.7; font-size:.85rem; display:block;}
  .total{font-size:1rem; font-weight:700; text-align:right; color:var(--gold);}
  .actions{display:flex; gap:8px;}
  .actions button{flex:1; padding:10px; border:none; border-radius:4px; font-size:.85rem; font-weight:600; cursor:pointer;}
  .btn-prep{background:var(--blue); color:#fff;}
  .btn-print{background:var(--line); color:var(--cream);}
  .btn-done{background:var(--green); color:#fff;}
  .btn-del{background:var(--red); color:#fff; flex:0 0 auto; padding:10px 12px;}
  .new-flash{animation:flash 1s ease 3;}
  @keyframes flash{0%,100%{box-shadow:0 0 0 rgba(201,152,47,0);} 50%{box-shadow:0 0 24px rgba(201,152,47,.7);}}

  #ticket{display:none;}
  @media print{
    body *{visibility:hidden;}
    #ticket, #ticket *{visibility:visible;}
    #ticket{position:absolute; top:0; left:0; width:76mm; padding:3mm; font-family:'Courier New', monospace; color:#000;}
    @page{ size:80mm auto; margin:0; }
  }
  .tk-center{text-align:center;}
  .tk-title{font-size:15px; font-weight:700;}
  .tk-ar{font-size:14px; direction:rtl;}
  .tk-line{border-top:1px dashed #000; margin:6px 0;}
  .tk-row{display:flex; justify-content:space-between; font-size:11px; margin:2px 0;}
  .tk-item{font-size:12px; margin:6px 0;}
  .tk-item .qn{font-weight:700;}
  .tk-item .an{direction:rtl; display:block; font-size:13px;}
  .tk-foot{font-size:10px; text-align:center; margin-top:8px;}
</style>
</head>
<body>

<div id="loginWrap">
  <h2>Kitchen Login</h2>
  <input id="lEmail" type="email" placeholder="Staff email">
  <input id="lPass" type="password" placeholder="Password">
  <button onclick="doLogin()">Login</button>
  <div id="loginErr"></div>
</div>

<header id="hdr" style="display:none;">
  <h1>👨‍🍳 Wafi Café — KOD</h1>
  <div class="clock" id="clock"></div>
  <button id="histBtn" onclick="toggleHistory()">History</button>
  <button onclick="doLogout()">Logout</button>
</header>

<div id="board"></div>
<div id="ticket"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDdOB4FfhuSBzR8NV0datVU8B9_GcHmof4",
    authDomain: "waficafe-f6453.firebaseapp.com",
    projectId: "waficafe-f6453",
    storageBucket: "waficafe-f6453.firebasestorage.app",
    messagingSenderId: "524923915772",
    appId: "1:524923915772:web:b3cd50bd1e7e663af7f679",
    measurementId: "G-PX0Z8ETGN4"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();

  function doLogin(){
    const email = document.getElementById('lEmail').value.trim();
    const pass = document.getElementById('lPass').value;
    document.getElementById('loginErr').textContent = '';
    auth.signInWithEmailAndPassword(email, pass).catch(err=>{
      document.getElementById('loginErr').textContent = 'Login failed: ' + err.message;
    });
  }
  function doLogout(){ auth.signOut(); }

  let unsub = null;
  let unsubHist = null;
  let firstLoad = true;
  let viewMode = 'active'; // 'active' | 'history'
  const beep = new Audio('data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoAAACAgICAgICA');

  auth.onAuthStateChanged(user => {
    if (user){
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('hdr').style.display = 'flex';
      document.getElementById('board').style.display = 'grid';
      startListener();
    } else {
      document.getElementById('loginWrap').style.display = 'block';
      document.getElementById('hdr').style.display = 'none';
      document.getElementById('board').style.display = 'none';
      if (unsub) unsub();
      if (unsubHist) unsubHist();
    }
  });

  function toggleHistory(){
    const btn = document.getElementById('histBtn');
    if (viewMode === 'active'){
      viewMode = 'history';
      btn.textContent = 'Back to Board';
      btn.classList.add('active');
      if (unsub) unsub();
      startHistoryListener();
    } else {
      viewMode = 'active';
      btn.textContent = 'History';
      btn.classList.remove('active');
      if (unsubHist) unsubHist();
      startListener();
    }
  }

  function startHistoryListener(){
    const since = new Date(Date.now() - 12*60*60*1000); // last 12 hours, covers a shift
    unsubHist = db.collection('orders')
      .where('status','==','done')
      .where('completedAt','>=', firebase.firestore.Timestamp.fromDate(since))
      .orderBy('completedAt','desc')
      .limit(40)
      .onSnapshot(snap => renderHistory(snap.docs), err => {
        console.error(err);
        document.getElementById('board').innerHTML = '<div class="empty">Could not load history — check console (index may be needed)</div>';
      });
  }

  function renderHistory(docs){
    const board = document.getElementById('board');
    if (docs.length === 0){
      board.innerHTML = '<div class="empty">No completed orders in the last 12 hours</div>';
      return;
    }
    board.innerHTML = docs.map(doc => {
      const o = doc.data();
      const lines = (o.items||[]).map(l => `
        <div class="line">
          <span><span class="qn">${l.qty}×</span>${l.en}${l.size?` (${l.size})`:''}</span>
        </div>
        ${l.ar?`<span class="ar">${l.ar}</span>`:''}
      `).join('');
      return `<div class="card" id="card-${doc.id}">
        <div class="card-head">
          <div class="tbl">${escapeHtml(o.table)||'—'}</div>
          <div class="time">done ${timeAgo(o.completedAt)}</div>
        </div>
        <span class="type">${o.type||''}</span>
        <div class="lines">${lines}</div>
        <div class="total">${(o.total||0).toFixed(2)} SR</div>
        <div class="actions">
          <button class="btn-print" onclick="printTicket('${doc.id}')">Print</button>
          <button class="btn-prep" onclick="reopenOrder('${doc.id}')">Reopen</button>
        </div>
      </div>`;
    }).join('');
  }

  function reopenOrder(id){
    if (!confirm('Send this order back to the active board?')) return;
    db.collection('orders').doc(id).update({
      status: 'preparing',
      completedAt: firebase.firestore.FieldValue.delete()
    }).then(()=>{
      toggleHistory(); // jump back to active board so they see it
    }).catch(err => alert('Failed: '+err.message));
  }

  function startListener(){
    if (viewMode !== 'active') return;
    firstLoad = true;
    unsub = db.collection('orders')
      .where('status', 'in', ['new','preparing'])
      .orderBy('createdAt','asc')
      .onSnapshot(snap => {
        renderBoard(snap.docs);
        if (!firstLoad){
          const added = snap.docChanges().some(c => c.type === 'added');
          if (added) beep.play().catch(()=>{});
        }
        firstLoad = false;
      });
  }

  function escapeHtml(str){
    return String(str||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }

  function timeAgo(ts){
    if (!ts) return '';
    const mins = Math.floor((Date.now() - ts.toDate().getTime())/60000);
    return mins <= 0 ? 'just now' : mins + ' min ago';
  }

  function renderBoard(docs){
    const board = document.getElementById('board');
    if (docs.length === 0){
      board.innerHTML = '<div class="empty">No active orders — kitchen is clear ✓</div>';
      return;
    }
    board.innerHTML = docs.map(doc => {
      const o = doc.data();
      const lines = (o.items||[]).map(l => `
        <div class="line">
          <span><span class="qn">${l.qty}×</span>${l.en}${l.size?` (${l.size})`:''}</span>
        </div>
        ${l.ar?`<span class="ar">${l.ar}</span>`:''}
      `).join('');
      return `<div class="card ${o.status==='preparing'?'preparing':''}" id="card-${doc.id}">
        <div class="card-head">
          <div class="tbl">${escapeHtml(o.table)||'—'}</div>
          <div class="time">${timeAgo(o.createdAt)}</div>
        </div>
        <span class="type">${o.type||''}</span>
        <div class="lines">${lines}</div>
        <div class="total">${(o.total||0).toFixed(2)} SR</div>
        <div class="actions">
          ${o.status==='new' ? `<button class="btn-prep" onclick="setStatus('${doc.id}','preparing')">Preparing</button>` : ''}
          <button class="btn-print" onclick="printTicket('${doc.id}')">Print</button>
          <button class="btn-done" onclick="setStatus('${doc.id}','done')">Done</button>
          <button class="btn-del" onclick="requestDelete('${doc.id}','${o.status}')" title="Ask admin to delete">🗑</button>
        </div>
      </div>`;
    }).join('');
  }

  function setStatus(id, status){
    const data = { status };
    if (status === 'done') data.completedAt = firebase.firestore.FieldValue.serverTimestamp();
    db.collection('orders').doc(id).update(data);
  }

  function requestDelete(id, currentStatus){
    const reason = prompt('Why delete this order? (sent to admin for approval)');
    if (reason === null) return; // cancelled
    db.collection('orders').doc(id).update({
      previousStatus: currentStatus,
      status: 'delete_requested',
      deleteReason: reason.trim(),
      deleteRequestedAt: firebase.firestore.FieldValue.serverTimestamp(),
      deleteRequestedBy: (auth.currentUser && auth.currentUser.email) || 'kitchen'
    }).then(()=>{
      alert('Delete request sent to admin. Order removed from board until approved.');
    }).catch(err=>alert('Failed: '+err.message));
  }

  async function printTicket(id){
    const doc = await db.collection('orders').doc(id).get();
    const o = doc.data();
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-GB', { timeZone:'Asia/Riyadh' });
    const timeStr = now.toLocaleTimeString('en-GB', { timeZone:'Asia/Riyadh', hour:'2-digit', minute:'2-digit' });
    const ticket = document.getElementById('ticket');
    ticket.innerHTML = `
      <div class="tk-center tk-title">Wafi Café</div>
      <div class="tk-center tk-ar">وافي كافيه</div>
      <div class="tk-line"></div>
      <div class="tk-center tk-title">KITCHEN ORDER</div>
      <div class="tk-line"></div>
      <div class="tk-row"><span>Table/Name</span><span>${escapeHtml(o.table)||'—'}</span></div>
      <div class="tk-row"><span>Type</span><span>${o.type||''}</span></div>
      <div class="tk-row"><span>Date</span><span>${dateStr}</span></div>
      <div class="tk-row"><span>Time</span><span>${timeStr}</span></div>
      <div class="tk-line"></div>
      ${(o.items||[]).map(l => `<div class="tk-item"><span class="qn">${l.qty} ×</span> ${l.en}${l.size?` (${l.size})`:''}<span class="an">${l.ar||''}</span></div>`).join('')}
      <div class="tk-line"></div>
      <div class="tk-foot">Kitchen copy — not a tax invoice<br>نسخة المطبخ — ليست فاتورة ضريبية</div>
    `;
    window.print();
  }

  function tickClock(){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB', { timeZone:'Asia/Riyadh' });
  }
  setInterval(tickClock, 1000); tickClock();
</script>
</body>
</html>
