<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wafi Café — Price Updater</title>
<style>
  :root{ --bg:#12100e; --card:#1d1a16; --line:#3a352c; --gold:#c9982f; --cream:#f6ecd9; --green:#2e8b57; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--cream); font-family:'Segoe UI', Arial, sans-serif; min-height:100vh;}
  header{padding:16px 20px; background:#000; border-bottom:2px solid var(--gold); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5;}
  header h1{font-size:1.1rem; color:var(--gold);}
  header button{background:transparent; border:1px solid var(--line); color:var(--cream); padding:7px 12px; border-radius:4px; font-size:.8rem;}

  #loginWrap{max-width:320px; margin:100px auto; padding:28px; background:var(--card); border:1px solid var(--line); border-radius:8px;}
  #loginWrap h2{color:var(--gold); margin-bottom:18px; text-align:center;}
  #loginWrap input{width:100%; padding:12px; margin-bottom:12px; border:1px solid var(--line); border-radius:4px; background:#0f0d0b; color:var(--cream); font-size:1rem;}
  #loginWrap button{width:100%; padding:13px; background:var(--gold); color:#1a0f0a; border:none; border-radius:4px; font-weight:700; font-size:1rem;}
  #loginErr{color:#c0392b; font-size:.85rem; margin-top:8px; text-align:center; min-height:18px;}

  main{display:none; padding:16px; max-width:700px; margin:0 auto;}
  .search{width:100%; padding:12px; margin-bottom:16px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--cream); font-size:.95rem;}
  .cat{margin-bottom:22px;}
  .cat h2{color:var(--gold); font-size:1rem; margin-bottom:10px; border-bottom:1px solid var(--line); padding-bottom:6px;}
  .row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line);}
  .row .nm{flex:1; font-size:.9rem;}
  .row .nm .ar{display:block; font-size:.75rem; opacity:.6; direction:rtl;}
  .row input{width:80px; padding:8px; border:1px solid var(--line); border-radius:4px; background:#0f0d0b; color:var(--cream); text-align:right; font-size:.9rem;}
  .row .unit{font-size:.75rem; opacity:.6;}
  .row .save{padding:8px 12px; background:var(--gold); color:#1a0f0a; border:none; border-radius:4px; font-size:.75rem; font-weight:700; cursor:pointer;}
  .row .save.saved{background:var(--green); color:#fff;}
  .stock{padding:8px 10px; border:1px solid var(--line); border-radius:4px; font-size:.72rem; font-weight:700; cursor:pointer; white-space:nowrap;}
  .stock.in{background:transparent; color:var(--green); border-color:var(--green);}
  .stock.out{background:#c0392b; color:#fff; border-color:#c0392b;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--gold); color:#1a0f0a;
    padding:12px 22px; border-radius:24px; font-weight:700; opacity:0; transition:.3s; pointer-events:none; font-size:.85rem;
  }
  .toast.show{opacity:1;}
</style>
</head>

  function idFor(catKey, i, sIdx){ return sIdx===undefined ? `${catKey}-${i}` : `${catKey}-${i}-${sIdx}`; }
  function priceToNumber(p){ const m = String(p||'').match(/[\d.]+/); return m ? parseFloat(m[0]) : 0; }

  const overrides = {}; // id -> number, loaded from Firestore

  auth.onAuthStateChanged(user => {
    if (user){
      document.getElementById('loginWrap').style.display = 'none';
      document.getElementById('hdr').style.display = 'flex';
      document.getElementById('main').style.display = 'block';
      loadOverridesAndRender();
    } else {
      document.getElementById('loginWrap').style.display = 'block';
      document.getElementById('hdr').style.display = 'none';
      document.getElementById('main').style.display = 'none';
    }
  });

  async function loadOverridesAndRender(){
    const snap = await db.collection('prices').get();
    snap.forEach(doc => overrides[doc.id] = doc.data());
    renderList();
  }

  function renderList(){
    const list = document.getElementById('list');
    list.innerHTML = MENU.map(cat => {
      const rows = cat.items.map((it, idx) => {
        if (it.sizes){
          return it.sizes.map((s, sIdx) => {
            const id = idFor(cat.key, idx, sIdx);
            const ov = overrides[id];
            const current = ov && ov.price !== undefined ? ov.price : priceToNumber(s[1]);
            const available = !ov || ov.available !== false;
            return rowHtml(id, `${it.name} (${s[0]})`, it.ar, current, available);
          }).join('');
        } else {
          const id = idFor(cat.key, idx);
          const ov = overrides[id];
          const current = ov && ov.price !== undefined ? ov.price : priceToNumber(it.price);
          const available = !ov || ov.available !== false;
          return rowHtml(id, it.name, it.ar, current, available);
        }
      }).join('');
      return `<div class="cat" data-cat="${cat.key}"><h2>${cat.en}</h2>${rows}</div>`;
    }).join('');
  }

  function rowHtml(id, name, ar, price, available){
    return `<div class="row" data-search="${(name+' '+(ar||'')).toLowerCase()}">
      <div class="nm">${name}${ar?`<span class="ar">${ar}</span>`:''}</div>
      <input type="number" step="0.5" min="0" id="in-${id}" value="${price}">
      <span class="unit">SR</span>
      <button class="save" id="btn-${id}" onclick="savePrice('${id}')">Save</button>
      <button class="stock ${available?'in':'out'}" id="stock-${id}" onclick="toggleStock('${id}')">${available?'In Stock':'Out of Stock'}</button>
    </div>`;
  }

  async function savePrice(id){
    const val = parseFloat(document.getElementById('in-'+id).value);
    if (isNaN(val) || val < 0){ alert('Enter a valid price'); return; }
    const btn = document.getElementById('btn-'+id);
    btn.textContent = '...';
    try {
      await db.collection('prices').doc(id).set({
        price: val,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      overrides[id] = Object.assign({}, overrides[id], { price: val });
      btn.textContent = 'Saved ✓';
      btn.classList.add('saved');
      showToast('Price updated');
      setTimeout(()=>{ btn.textContent='Save'; btn.classList.remove('saved'); }, 1800);
    } catch(err){
      btn.textContent = 'Save';
      alert('Failed: ' + err.message);
    }
  }

  async function toggleStock(id){
    const currentlyAvailable = !overrides[id] || overrides[id].available !== false;
    const newVal = !currentlyAvailable;
    const btn = document.getElementById('stock-'+id);
    btn.disabled = true;
    try {
      await db.collection('prices').doc(id).set({
        available: newVal,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      overrides[id] = Object.assign({}, overrides[id], { available: newVal });
      btn.textContent = newVal ? 'In Stock' : 'Out of Stock';
      btn.className = 'stock ' + (newVal ? 'in' : 'out');
      showToast(newVal ? 'Marked back in stock' : 'Marked out of stock');
    } catch(err){
      alert('Failed: ' + err.message);
    }
    btn.disabled = false;
  }

  function filterList(){
    const q = document.getElementById('searchBox').value.toLowerCase();
    document.querySelectorAll('.row').forEach(row => {
      row.style.display = row.dataset.search.includes(q) ? 'flex' : 'none';
    });
    document.querySelectorAll('.cat').forEach(cat => {
      const anyVisible = Array.from(cat.querySelectorAll('.row')).some(r => r.style.display !== 'none');
      cat.style.display = anyVisible ? 'block' : 'none';
    });
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1800);
  }
